name: 'WordPress Plugin Checks'
on: # rebuild any PRs and main branch changes
  push:
    branches:
    - trunk
    - develop

  pull_request:
    branches:
      - trunk
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Run plugin check
      uses: wordpress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
      with:
        exclude-checks: |
          plugin_readme
          plugin_updater
          file_type
          trademarks
          direct_db_queries
          performant_wp_query_params
          enqueued_scripts_in_footer
          plugin_header_text_domain

        exclude-directories: |
          .github
          node_modules
          vendor
          tests
          bin
          build
          build
          assets

        exclude-files: |
          .eslintignore
          .eslintrc.js
          .gitignore
          .nvmrc
          .gitattributes
          .phpcs.xml.dist
          .wp-env.json
          .prettierrc.js
          .stylelintrc.json

        ignore-warnings: true
